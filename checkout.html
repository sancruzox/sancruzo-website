<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout – San Cruzo</title>
    <link rel="icon" type="image/png" href="https://sancruzowebsite.b-cdn.net/S-Blitz%20Logo%20Design%202024.png">
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #f0f0f0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* NAV */
        .checkout-nav {
            width: 100%;
            padding: 18px 40px;
            background: #f0f0f0;
            border-bottom: 1px solid rgba(0,0,0,0.09);
        }
        .checkout-nav a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .checkout-nav img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        .checkout-nav span {
            color: #000;
            font-size: 15px;
            font-weight: 600;
        }

        /* LAYOUT */
        .checkout-layout {
            width: 100%;
            max-width: 980px;
            padding: 40px 32px 80px;
            display: flex;
            align-items: flex-start;
            gap: 32px;
        }

        /* LEFT — Paddle iFrame in weißer Karte */
        .col-checkout {
            flex: 1 1 0;
            min-width: 0;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.07);
            overflow: hidden;
        }

        #paddle-checkout-container {
            width: 100%;
        }

        .status-msg {
            text-align: center;
            padding: 80px 24px;
            font-size: 14px;
            color: #999;
        }
        .status-msg.error { color: #e05555; }

        /* RIGHT — Warenkorb (kein weißer Hintergrund) */
        .col-summary {
            flex: 0 0 320px;
            display: none;
            padding-top: 4px;
        }
        .col-summary.visible { display: block; }

        .summary-title {
            font-size: 20px;
            font-weight: 700;
            color: #111;
            margin-bottom: 24px;
        }

        /* Produktzeile */
        .summary-product {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }
        .summary-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #ddd;
            flex-shrink: 0;
        }
        .summary-product-info {
            flex: 1;
        }
        .summary-product-name {
            font-size: 14px;
            font-weight: 600;
            color: #111;
            line-height: 1.3;
        }
        .summary-product-sub {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }
        .summary-product-price {
            font-size: 14px;
            font-weight: 600;
            color: #111;
            white-space: nowrap;
        }

        /* Divider */
        .summary-divider {
            height: 1px;
            background: rgba(0,0,0,0.12);
            margin: 16px 0;
        }

        /* Gesamtbetrag */
        .summary-total-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .summary-total-label {
            font-size: 16px;
            font-weight: 700;
            color: #111;
        }
        .summary-total-price {
            font-size: 20px;
            font-weight: 700;
            color: #111;
        }

        /* MOBILE */
        @media (max-width: 700px) {
            .checkout-layout {
                flex-direction: column;
                padding: 24px 16px 60px;
                gap: 24px;
            }
            .col-summary {
                flex: none;
                width: 100%;
                order: -1;
            }
        }
    </style>
</head>
<body>

    <nav class="checkout-nav">
        <a href="https://sancruzo.com/">
            <img src="https://sancruzowebsite.b-cdn.net/San%20Cruzo%20Logo%202026%20-%20Rund.png" alt="San Cruzo">
            <span>San Cruzo</span>
        </a>
    </nav>

    <div class="checkout-layout">

        <!-- LINKS: Paddle Checkout (weiße Karte) -->
        <div class="col-checkout">
            <div id="paddle-checkout-container" class="paddle-checkout-container">
                <p class="status-msg">Checkout wird geladen…</p>
            </div>
        </div>

        <!-- RECHTS: Warenkorb (grau, kein weißer Container) -->
        <div class="col-summary" id="col-summary">
            <h2 class="summary-title">Dein Warenkorb</h2>

            <div class="summary-product">
                <img class="summary-img" id="product-img" src="" alt="">
                <div class="summary-product-info">
                    <p class="summary-product-name" id="product-name"></p>
                    <p class="summary-product-sub">Digitaler Download</p>
                </div>
                <span class="summary-product-price" id="product-price"></span>
            </div>

            <div class="summary-divider"></div>

            <div class="summary-total-row">
                <span class="summary-total-label">Gesamtbetrag</span>
                <span class="summary-total-price" id="total-price"></span>
            </div>
        </div>

    </div>

<script>
    const PRODUCTS = {
        'pri_01ktkv8ch0kxjn095nvcdwd3qy': { name: 'Vocal Preset "Shawty"',               price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/REEZY%20Preset%20Artwork%20Dark%203d%20edit%20(heller).png' },
        'pri_01ktkw6s4m3nhthfvstpyvt02v': { name: 'Vocal Preset "Shabab"',               price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/Pashanim%20Preset%20Artwork%20Dark%203d%20edit.png' },
        'pri_01ktkw8f6gsz10gtec0kk64d7a': { name: 'Vocal Preset "UFO"',                  price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/ufo%20Preset%20Artwork%20Dark%203d%20edit.png' },
        'pri_01ktkw9r87n8ycgysq35ntr674': { name: 'Vocal Preset "Akh"',                  price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/nizi%20preset%20artwork%20dark%203d%20edit.png' },
        'pri_01ktkwayca8wd7vw0zz7fj4q0w': { name: 'Vocal Preset "Absinth"',              price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/Absent%20Preset%20Artwork%20Dark%203d%20edit.png' },
        'pri_01ktkwbx1v5d150ahzqkpq57p4': { name: 'Vocal Preset "101"',                  price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/lucio101%20preset%20artwork%20dark%203d%20edit.png' },
        'pri_01ktkwcrkpfp9x2p3tk9xrs4df': { name: 'Vocal Preset "Palmen"',               price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/raf%20Preset%20Artwork%20Dark%203d%20edit.png' },
        'pri_01ktkwefavzr4c0j7tcqmy35j1': { name: 'Vocal Preset "Feuer"',                price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/Faroon%20Preset%20Artwork%20Dark%203d%20edit.png' },
        'pri_01ktkwff3eccqk8yt1zvmapbrj': { name: 'Vocal Preset "New Era"',              price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/Luis%20Preset%20Artwork%20Dark%203d%20edit.png' },
        'pri_01ktkwggaqste7gpd0nkp8g13k': { name: 'Vocal Preset "Cataleya"',             price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/Samra%20preset%20artwork%20dark%203d%20edit.png' },
        'pri_01ktkwjhms1mrqk4983gbs4ybq': { name: 'Vocal Preset "La Cassetta"',          price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/lacazette%20procuct%20card%203d%20dark%20version%20v2%20edit3.png' },
        'pri_01ktkwhf6jvqzg8zqp8nfpyg4c': { name: 'Vocal Preset "We Made It"',           price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/tlow%20Preset%20Artwork%20Dark%203d%20edit.png' },
        'pri_01ktkqz0g49dxb5s8e2z6q6gks': { name: 'Artist Preset Bundle',                price: '€39', img: 'https://artist-pack.b-cdn.net/Sonstige%20Bilder/Artist%20Preset%20Bundle%20V2.0%20Artwork%20Vertikal.png' },
        'pri_01ktktrm65h16ftcxv8s1abzwh': { name: 'Artist Preset Bundle + Mastering',    price: '€44', img: 'https://artist-pack.b-cdn.net/Sonstige%20Bilder/Artist%20Preset%20Bundle%20V2.0%20Artwork%20Vertikal.png' },
        'pri_01kt6sygdpbkdty9t155mfz6zh': { name: 'Pro Vocal Preset',                    price: '€29', img: 'https://pvpp-images.b-cdn.net/Main%20Bundle%20Artwork/pro%20vocal%20preset%20mockup%20remaster%20v3%20edit.png' },
        'pri_01ktkty0m4m3njc70kmfv3m252': { name: 'Pro Vocal Preset + Mastering Chain',  price: '€34', img: 'https://pvpp-images.b-cdn.net/Main%20Bundle%20Artwork/pro%20vocal%20preset%20mockup%20remaster%20v3%20edit.png' },
        'pri_01ktkv15yx08zp2dz6j8k50zge': { name: 'Pro Adlib Preset Pack',               price: '€19', img: 'https://sancruzowebsite.b-cdn.net/Mockups/Pro%20Adlibs%20Pack%20Mockup%20Remaster%20edit_.png' },
        'pri_01ktkv3kwh0enm6nvsyze7rygs': { name: 'Pro Adlibs + Pro Filler FX Bundle',   price: '€25', img: 'https://sancruzowebsite.b-cdn.net/Mockups/Pro%20Adlibs%20Pack%20Mockup%20Remaster%20edit_.png' },
        'pri_01ktkv65tsjk505sywmyx7adzp': { name: 'Pro Filler FX Presets',               price: '€19', img: 'https://sancruzowebsite.b-cdn.net/Mockups/Filller%20FX%20Product%20Mockup%20NEU%20v2%20edit_.png' },
        'pri_01kt6r1wwer0rn42hvt1yvgk14': { name: 'Vocals Abmischen – Online Video Kurs',price: '€79', img: 'https://sancruzowebsite.b-cdn.net/Vocal%20Kurs/Kurs2_Artwork_Vertikalv2.png', sub: 'Online Video Kurs' },
    };

    const params     = new URLSearchParams(window.location.search);
    const priceId    = params.get('price');
    const successUrl = params.get('success');

    if (!priceId) {
        document.getElementById('paddle-checkout-container').innerHTML =
            '<p class="status-msg error">Kein Produkt angegeben.</p>';
    } else {
        const product = PRODUCTS[priceId];
        if (product) {
            document.getElementById('product-img').src            = product.img;
            document.getElementById('product-img').alt            = product.name;
            document.getElementById('product-name').textContent   = product.name;
            document.getElementById('product-price').textContent  = product.price;
            document.getElementById('total-price').textContent    = product.price;
            if (product.sub) document.getElementById('product-name').nextElementSibling.textContent = product.sub;
            document.getElementById('col-summary').classList.add('visible');
        }

        Paddle.Initialize({
            token: 'live_8551962d454585de6c4f571a18b',
            checkout: {
                settings: {
                    displayMode: "inline",
                    theme: "light",
                    locale: "de",
                    frameTarget: "paddle-checkout-container",
                    frameInitialHeight: "450",
                    frameStyle: "width: 100%; min-width: 312px; background-color: transparent; border: none;"
                }
            }
        });

        document.getElementById('paddle-checkout-container').innerHTML = '';

        const checkoutOptions = {
            items: [{ priceId: priceId, quantity: 1 }]
        };
        if (successUrl) {
            checkoutOptions.settings = { successUrl: decodeURIComponent(successUrl) };
        }

        Paddle.Checkout.open(checkoutOptions);
    }
</script>

</body>
</html>
