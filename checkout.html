<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout – San Cruzo</title>
    <link rel="icon" type="image/png" href="https://sancruzowebsite.b-cdn.net/S-Blitz%20Logo%20Design%202024.png">
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #f0f0f0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* NAV */
        .checkout-nav {
            width: 100%;
            padding: 18px 40px;
            background: #f0f0f0;
            border-bottom: 1px solid rgba(0,0,0,0.09);
        }
        @media (max-width: 700px) {
            .checkout-nav {
                padding: 16px 20px;
            }
        }
        .checkout-nav a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .checkout-nav img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        .checkout-nav span {
            color: #000;
            font-size: 15px;
            font-weight: 600;
        }

        /* LAYOUT */
        .checkout-layout {
            width: 100%;
            max-width: 980px;
            padding: 40px 32px 80px;
            display: flex;
            align-items: flex-start;
            gap: 32px;
        }

        /* LEFT — Paddle iFrame in weißer Karte */
        .col-checkout {
            flex: 1 1 0;
            min-width: 0;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.07);
            padding: 28px;
        }

        #paddle-checkout-container {
            width: 100%;
        }

        .status-msg {
            text-align: center;
            padding: 80px 24px;
            font-size: 14px;
            color: #999;
        }
        .status-msg.error { color: #e05555; }


        /* RIGHT — Warenkorb (kein weißer Hintergrund) */
        .col-summary {
            flex: 0 0 320px;
            display: none;
            padding-top: 4px;
        }
        .col-summary.visible { display: block; }

        /* Zurück-Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #777;
            text-decoration: none;
            margin-bottom: 20px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
        }
        .back-link:hover { color: #333; }
        .back-link svg { flex-shrink: 0; }

        .summary-title {
            font-size: 20px;
            font-weight: 700;
            color: #111;
            margin-bottom: 24px;
        }

        /* Produktzeile */
        .summary-product {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }
        .summary-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: contain;
            object-position: center;
            padding: 5px;
            background: #222;
            flex-shrink: 0;
        }
        .summary-product-info {
            flex: 1;
        }
        .summary-product-name {
            font-size: 14px;
            font-weight: 600;
            color: #111;
            line-height: 1.3;
        }
        .summary-product-sub {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }
        .summary-product-price {
            font-size: 14px;
            font-weight: 600;
            color: #111;
            white-space: nowrap;
        }

        /* Divider */
        .summary-divider {
            height: 1px;
            background: rgba(0,0,0,0.12);
            margin: 16px 0;
        }

        /* Gesamtbetrag */
        .summary-total-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .summary-total-label {
            font-size: 16px;
            font-weight: 700;
            color: #111;
        }
        .summary-total-price {
            font-size: 20px;
            font-weight: 700;
            color: #111;
        }


        /* MwSt.-Hinweis unter Gesamtbetrag */
        .summary-tax {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
            text-align: right;
        }

        /* Vertrauenshinweise */
        .trust-list {
            list-style: none;
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .trust-list li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 13px;
            line-height: 1.4;
            color: #555;
        }
        .trust-list svg { flex-shrink: 0; margin-top: 1px; }
        .trust-mobile { display: none; }

        /* Ladezustand: bleibt sichtbar, bis Paddle "checkout.loaded" meldet */
        .col-checkout .status-msg.hidden { display: none; }

        /* MOBILE */
        @media (max-width: 700px) {
            .checkout-layout {
                flex-direction: column;
                padding: 16px 12px 60px;
                gap: 20px;
            }
            .col-checkout {
                width: 100%;
                padding: 12px;
            }
            .col-summary {
                flex: none;
                width: 100%;
                order: -1;
            }
            /* Kompakter Warenkorb oben, damit das Formular schneller sichtbar ist */
            .summary-title { display: none; }
            .back-link { margin-bottom: 12px; }
            .summary-product { margin-bottom: 12px; }
            .summary-img { width: 48px; height: 48px; }
            .summary-divider { margin: 10px 0; }
            .summary-total-label, .summary-total-price { font-size: 15px; }
            .col-summary .trust-list { display: none; }
            .trust-mobile { display: flex; margin: 20px 4px 4px; }
        }
    </style>
</head>
<body>

    <nav class="checkout-nav">
        <a href="https://sancruzo.com/">
            <img src="https://sancruzowebsite.b-cdn.net/San%20Cruzo%20Logo%202026%20-%20Rund.png" alt="San Cruzo">
            <span>San Cruzo</span>
        </a>
    </nav>

    <div class="checkout-layout">

        <!-- LINKS: Paddle Checkout (weiße Karte) -->
        <div class="col-checkout">
            <p class="status-msg" id="status-msg">Checkout wird geladen…</p>
            <div id="paddle-checkout-container" class="paddle-checkout-container"></div>
            <ul class="trust-list trust-mobile">
                <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Sichere Zahlung mit PayPal, Karte oder Apple Pay</span></li>
                <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><span>Download-Link sofort per E-Mail</span></li>
            </ul>
        </div>

        <!-- RECHTS: Warenkorb (grau, kein weißer Container) -->
        <div class="col-summary" id="col-summary">
            <button class="back-link" onclick="history.back()">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Zurück
            </button>
            <h2 class="summary-title">Dein Warenkorb</h2>

            <div class="summary-product">
                <img class="summary-img" id="product-img" src="" alt="">
                <div class="summary-product-info">
                    <p class="summary-product-name" id="product-name"></p>
                    <p class="summary-product-sub">Digitaler Download</p>
                </div>
                <span class="summary-product-price" id="product-price"></span>
            </div>

            <div class="summary-divider"></div>

            <div class="summary-total-row">
                <span class="summary-total-label">Gesamtbetrag</span>
                <span class="summary-total-price" id="total-price"></span>
            </div>
            <p class="summary-tax" id="total-tax">inkl. MwSt.</p>

            <ul class="trust-list">
                <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Sichere Zahlung mit PayPal, Karte oder Apple Pay</span></li>
                <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><span>Download-Link sofort per E-Mail</span></li>
            </ul>
        </div>

    </div>

<script>
    const PRODUCTS = {
        'pri_01ktkv8ch0kxjn095nvcdwd3qy': { name: 'Vocal Preset "Shawty"',               price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/REEZY%20Preset%20Artwork%20Dark%203d%20edit%20(heller).png' },
        'pri_01ktkw6s4m3nhthfvstpyvt02v': { name: 'Vocal Preset "Shabab"',               price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/Pashanim%20Preset%20Artwork%20Dark%203d%20edit.png' },
        'pri_01ktkw8f6gsz10gtec0kk64d7a': { name: 'Vocal Preset "UFO"',                  price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/ufo%20Preset%20Artwork%20Dark%203d%20edit.png' },
        'pri_01ktkw9r87n8ycgysq35ntr674': { name: 'Vocal Preset "Akh"',                  price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/nizi%20preset%20artwork%20dark%203d%20edit.png' },
        'pri_01ktkwayca8wd7vw0zz7fj4q0w': { name: 'Vocal Preset "Absinth"',              price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/Absent%20Preset%20Artwork%20Dark%203d%20edit.png' },
        'pri_01ktkwbx1v5d150ahzqkpq57p4': { name: 'Vocal Preset "101"',                  price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/lucio101%20preset%20artwork%20dark%203d%20edit.png' },
        'pri_01ktkwcrkpfp9x2p3tk9xrs4df': { name: 'Vocal Preset "Palmen"',               price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/raf%20Preset%20Artwork%20Dark%203d%20edit.png' },
        'pri_01ktkwefavzr4c0j7tcqmy35j1': { name: 'Vocal Preset "Feuer"',                price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/Faroon%20Preset%20Artwork%20Dark%203d%20edit.png' },
        'pri_01ktkwff3eccqk8yt1zvmapbrj': { name: 'Vocal Preset "New Era"',              price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/Luis%20Preset%20Artwork%20Dark%203d%20edit.png' },
        'pri_01ktkwggaqste7gpd0nkp8g13k': { name: 'Vocal Preset "Cataleya"',             price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/Samra%20preset%20artwork%20dark%203d%20edit.png' },
        'pri_01ktkwjhms1mrqk4983gbs4ybq': { name: 'Vocal Preset "La Cassetta"',          price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/lacazette%20procuct%20card%203d%20dark%20version%20v2%20edit3.png' },
        'pri_01ktkwhf6jvqzg8zqp8nfpyg4c': { name: 'Vocal Preset "We Made It"',           price: '€29', img: 'https://artist-pack.b-cdn.net/Preview%20Tabs/Dark%20Versions/tlow%20Preset%20Artwork%20Dark%203d%20edit.png' },
        'pri_01ktkqz0g49dxb5s8e2z6q6gks': { name: 'Artist Preset Bundle',                price: '€39', img: 'https://artist-pack.b-cdn.net/Sonstige%20Bilder/Artist%20Preset%20Bundle%20V2.0%20Artwork%20Vertikal.png' },
        'pri_01ktktrm65h16ftcxv8s1abzwh': { name: 'Artist Preset Bundle + Mastering',    price: '€44', img: 'https://artist-pack.b-cdn.net/Sonstige%20Bilder/Artist%20Preset%20Bundle%20V2.0%20Artwork%20Vertikal.png' },
        'pri_01kt6sygdpbkdty9t155mfz6zh': { name: 'Pro Vocal Preset',                    price: '€29', img: 'https://pvpp-images.b-cdn.net/Main%20Bundle%20Artwork/pro%20vocal%20preset%20mockup%20remaster%20v3%20edit.png' },
        'pri_01ktkty0m4m3njc70kmfv3m252': { name: 'Pro Vocal Preset + Mastering Chain',  price: '€34', img: 'https://pvpp-images.b-cdn.net/Main%20Bundle%20Artwork/pro%20vocal%20preset%20mockup%20remaster%20v3%20edit.png' },
        'pri_01ktkv15yx08zp2dz6j8k50zge': { name: 'Pro Adlib Preset Pack',               price: '€19', img: 'https://sancruzowebsite.b-cdn.net/Mockups/Pro%20Adlibs%20Pack%20Mockup%20Remaster%20edit_.png' },
        'pri_01ktkv3kwh0enm6nvsyze7rygs': { name: 'Pro Adlibs + Pro Filler FX Bundle',   price: '€25', img: 'https://sancruzowebsite.b-cdn.net/Mockups/Pro%20Adlibs%20Pack%20Mockup%20Remaster%20edit_.png' },
        'pri_01ktkv65tsjk505sywmyx7adzp': { name: 'Pro Filler FX Presets',               price: '€19', img: 'https://sancruzowebsite.b-cdn.net/Mockups/Filller%20FX%20Product%20Mockup%20NEU%20v2%20edit_.png' },
        'pri_01kt6r1wwer0rn42hvt1yvgk14': { name: 'Vocals Abmischen – Online Video Kurs',price: '€79', img: 'https://sancruzowebsite.b-cdn.net/Vocal%20Kurs/Kurs2_Artwork_Vertikalv2.png', sub: 'Online Video Kurs' },
    };

    const params     = new URLSearchParams(window.location.search);
    const priceId    = params.get('price');
    const successUrl = params.get('success');
    const product    = priceId ? PRODUCTS[priceId] : null;

    const $ = (id) => document.getElementById(id);

    function formatMoney(amount, currency) {
        try {
            return new Intl.NumberFormat('de-DE', { style: 'currency', currency: currency }).format(amount);
        } catch (e) {
            return amount + ' ' + currency;
        }
    }

    // Warenkorb rechts mit den echten Paddle-Beträgen aktualisieren
    // (Währung und MwSt. hängen vom Land des Käufers ab).
    // Paddle.js liefert Beträge als Dezimalzahl, z. B. 29 oder 24.37 – nicht in Cent.
    function updateSummary(data) {
        const totals   = data?.totals;
        const currency = data?.currency_code;
        if (!totals || !currency) return;

        const item = data.items?.[0];
        if (item?.totals?.total != null) $('product-price').textContent = formatMoney(item.totals.total, currency);
        $('total-price').textContent = formatMoney(totals.total, currency);
        $('total-tax').textContent = totals.tax > 0
            ? 'inkl. ' + formatMoney(totals.tax, currency) + ' MwSt.'
            : 'inkl. MwSt.';
    }

    function ga4Items(data) {
        return (data?.items || []).map(item => ({
            item_id:   item.price_id,
            item_name: item.product?.name || item.price_name || (product && product.name) || item.price_id,
            quantity:  item.quantity,
            price:     item.totals?.total
        }));
    }

    // Jedes Funnel-Event nur einmal pro Checkout senden
    const sentEvents = new Set();
    function trackOnce(key, eventName, payload) {
        if (sentEvents.has(key)) return;
        sentEvents.add(key);
        if (typeof gtag === 'function') gtag('event', eventName, payload);
    }

    function handlePaddleEvent(event) {
        const data = event.data;
        const base = data?.totals ? { currency: data.currency_code, value: data.totals.total } : {};

        switch (event.name) {
            case 'checkout.loaded':
                $('status-msg').classList.add('hidden');
                updateSummary(data);
                trackOnce('loaded', 'begin_checkout', { ...base, items: ga4Items(data) });
                break;

            case 'checkout.updated':
            case 'checkout.items.updated':
                updateSummary(data);
                break;

            case 'checkout.customer.created':
                trackOnce('customer', 'checkout_email_entered', { ...base, country: data?.customer?.address?.country_code });
                break;

            case 'checkout.payment.selected': {
                const type = data?.payment?.method_details?.type || 'unknown';
                trackOnce('payment_selected_' + type, 'add_payment_info', { ...base, payment_type: type, items: ga4Items(data) });
                break;
            }

            case 'checkout.payment.initiated': {
                const type = data?.payment?.method_details?.type || 'unknown';
                // Bei jedem Versuch senden (zählt Zahlungsversuche)
                if (typeof gtag === 'function') gtag('event', 'checkout_payment_initiated', { ...base, payment_type: type });
                break;
            }

            case 'checkout.payment.failed':
            case 'checkout.payment.error': {
                const type = data?.payment?.method_details?.type || 'unknown';
                if (typeof gtag === 'function') gtag('event', 'checkout_payment_failed', { ...base, payment_type: type });
                break;
            }

            case 'checkout.error':
                if (typeof gtag === 'function') gtag('event', 'checkout_error', { error: String(event.error?.detail || event.detail || 'unknown') });
                break;

            case 'checkout.completed': {
                // Duplikat-Schutz: dasselbe Event nur einmal pro Session
                const txId = data?.transaction_id || data?.id;
                const dedupeKey = 'ga4_purchase_' + txId;
                if (txId && sessionStorage.getItem(dedupeKey)) return;
                if (txId) sessionStorage.setItem(dedupeKey, '1');

                // transport_type 'beacon': Request geht auch bei sofortigem Redirect raus
                if (typeof gtag === 'function') gtag('event', 'purchase', {
                    transaction_id: txId,
                    value:          data?.totals?.total,
                    tax:            data?.totals?.tax,
                    currency:       data?.currency_code || data?.totals?.currency_code || 'EUR',
                    payment_type:   data?.payment?.method_details?.type,
                    items:          ga4Items(data),
                    transport_type: 'beacon'
                });
                break;
            }
        }
    }

    if (!priceId) {
        $('status-msg').textContent = 'Kein Produkt angegeben.';
        $('status-msg').classList.add('error');
    } else {
        if (product) {
            $('product-img').src           = product.img;
            $('product-img').alt           = product.name;
            $('product-name').textContent  = product.name;
            $('product-price').textContent = product.price;   // Platzhalter, bis Paddle die echten Beträge liefert
            $('total-price').textContent   = product.price;
            if (product.sub) $('product-name').nextElementSibling.textContent = product.sub;
            $('col-summary').classList.add('visible');
        }

        Paddle.Initialize({
            token: 'live_8551962d454585de6c4f571a18b',
            eventCallback: handlePaddleEvent,
            checkout: {
                settings: {
                    displayMode: "inline",
                    variant: "express",
                    theme: "light",
                    locale: "de",
                    frameTarget: "paddle-checkout-container",
                    frameInitialHeight: "450",
                    frameStyle: "width: 100%; min-width: 0; background-color: transparent; border: none;"
                }
            }
        });

        const checkoutOptions = {
            items: [{ priceId: priceId, quantity: 1 }],
            customData: { source_page: (function () { try { return document.referrer ? new URL(document.referrer).pathname : 'direct'; } catch (e) { return 'unknown'; } })() }
        };
        if (successUrl) {
            checkoutOptions.settings = { successUrl: decodeURIComponent(successUrl) };
        }

        Paddle.Checkout.open(checkoutOptions);
    }
</script>

</body>
</html>
