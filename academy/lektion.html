    const params  = new URLSearchParams(window.location.search);
    const k       = parseInt(params.get('k'));
    const l       = parseInt(params.get('l') || 0);
    const chapter = chapters[k];
    const lesson  = chapter?.lessons[l];

    if (chapter && lesson) {
        document.querySelector('.btn-logout').addEventListener('click', function() {
            localStorage.removeItem('academy_auth');
            window.location.href = 'login.html';
        });

        document.title = `${lesson.title} | San Cruzo Academy`;

        // Meta + Title
        document.getElementById('video-meta').textContent =
            `Kapitel ${k} · ${chapter.title}  ·  Lektion ${l + 1}`;
        document.getElementById('video-title').textContent = lesson.title;
        document.getElementById('video-description').textContent =
            lesson.description || '';

        // Video-URL aus lesson.link setzen (falls vorhanden)
        if (lesson.link) {
            document.getElementById('lesson-video').src = lesson.link;
        }

        // "Alle Lektionen" link
        document.getElementById('all-lessons-link').href = `kapitel.html?k=${k}`;

        // Active sidebar icon
        document.querySelectorAll('.nav-item-icon').forEach(item => {
            if (item.dataset.chapter === String(k)) item.classList.add('active');
        });

        // Next lessons (remaining in chapter after current)
        const nextList = document.getElementById('next-list');
        const nextLessons = chapter.lessons.slice(l + 1, l + 5); // max 4
        if (nextLessons.length === 0) {
            nextList.innerHTML = `<p class="no-next">Das war die letzte Lektion in diesem Kapitel.</p>`;
        } else {
            nextLessons.forEach((nl, i) => {
                const idx = l + 1 + i;
                const thumb = nl.thumbnail
                    ? `<img src="${nl.thumbnail}" alt="${nl.title}" class="next-thumb-img">`
                    : `<div class="next-thumb-placeholder"></div>`;
                nextList.innerHTML += `
                    <a href="lektion.html?k=${k}&l=${idx}" class="next-item">
                        <div class="next-thumb">${thumb}</div>
                        <div class="next-info">
                            <span class="next-title">${nl.title}</span>
                            <span class="next-chapter">Kapitel ${k}</span>
                            <span class="next-duration">${nl.duration}</span>
                        </div>
                    </a>`;
            });
        }
    }
</script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var wrappers = document.querySelectorAll('.custom-video-wrapper');
        wrappers.forEach(function(wrapper) {
            var video   = wrapper.querySelector('.custom-video');
            var overlay = wrapper.querySelector('.custom-overlay');

            wrapper.addEventListener('click', function() {
                overlay.style.display = 'none';
                video.controls = true;
                video.play();
            }, { once: true });
        });
    });
</script>
